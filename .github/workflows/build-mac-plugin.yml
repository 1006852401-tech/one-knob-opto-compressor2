name: Build & Package macOS AU and VST3 Plugins

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build Universal macOS AU & VST3
    runs-on: macos-14 # Native Apple Silicon M-series runner on GitHub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Auto-detect Project Directory Structure and Patch Settings
        run: |
          echo "=== Checking repository root files ==="
          ls -la
          if [ ! -f "CMakeLists.txt" ]; then
            CMAKEDIR=$(find . -maxdepth 3 -name "CMakeLists.txt" -not -path "*/.*" | head -n 1)
            if [ -n "$CMAKEDIR" ]; then
              SRC_DIR=$(dirname "$CMAKEDIR")
              echo "==> Moving files from subfolder $SRC_DIR to root..."
              cp -R "$SRC_DIR"/* .
            fi
          fi
          if [ ! -f "CMakeLists.txt" ]; then
            echo "::error::CMakeLists.txt not found! Please check if CMakeLists.txt was uploaded to the repository."
            exit 1
          fi
          # 自动热修补 1：解决 10.9 在 Apple Silicon arm64 上的系统版本非法报错
          sed -i '' 's/10\.9/11\.0/g' CMakeLists.txt 2>/dev/null || sed -i 's/10\.9/11\.0/g' CMakeLists.txt 2>/dev/null || true
          # 自动热修补 2：解决 AU_MAIN_TYPE "aufx" 导致的 constexpr 指针与整数比较语法错误
          sed -i '' 's/AU_MAIN_TYPE.*"aufx".*/AU_MAIN_TYPE kAudioUnitType_Effect/g' CMakeLists.txt 2>/dev/null || sed -i 's/AU_MAIN_TYPE.*"aufx".*/AU_MAIN_TYPE kAudioUnitType_Effect/g' CMakeLists.txt 2>/dev/null || true
          echo "=== Verified CMakeLists.txt deployment target and AU settings ==="
          grep -n "CMAKE_OSX" CMakeLists.txt || true
          grep -n "AU_MAIN_TYPE" CMakeLists.txt || true

      - name: Install Ninja Build Tool
        run: brew install ninja || true

      - name: "Configure CMake (Universal Binary: arm64 + x86_64, macOS 11.0+)"
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build AU, VST3 and Standalone
        run: |
          cmake --build build --config Release --parallel

      - name: Verify Universal Architecture with lipo
        run: |
          echo "=== Searching for built plugins ==="
          find build -name "*.component" -o -name "*.vst3"
          AU_BIN=$(find build -name "OneKnobOpto" -path "*component*" | head -n 1)
          VST_BIN=$(find build -name "OneKnobOpto" -path "*vst3*" | head -n 1)
          if [ -n "$AU_BIN" ]; then
            echo "=== AU Component Architecture ==="
            lipo -info "$AU_BIN" || true
          fi
          if [ -n "$VST_BIN" ]; then
            echo "=== VST3 Architecture ==="
            lipo -info "$VST_BIN" || true
          fi

      - name: Package Plugins for Distribution
        run: |
          mkdir -p dist/OneKnobOpto-macOS-Universal/AU
          mkdir -p dist/OneKnobOpto-macOS-Universal/VST3
          
          # 智能匹配产物位置，避免硬编码路径报错
          find build -name "OneKnobOpto.component" -exec cp -R {} dist/OneKnobOpto-macOS-Universal/AU/ \;
          find build -name "OneKnobOpto.vst3" -exec cp -R {} dist/OneKnobOpto-macOS-Universal/VST3/ \;
          
          cp install_mac_plugins.sh dist/OneKnobOpto-macOS-Universal/ || true
          cp README.md dist/OneKnobOpto-macOS-Universal/ || true
          
          cd dist
          zip -r ../OneKnobOpto-macOS-Universal.zip OneKnobOpto-macOS-Universal/
          echo "=== Packaged content ==="
          unzip -l ../OneKnobOpto-macOS-Universal.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneKnobOpto-macOS-Universal
          path: OneKnobOpto-macOS-Universal.zip

      - name: Create GitHub Release (Triggered on v* Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OneKnobOpto-macOS-Universal.zip
          title: Release ${{ github.ref_name }} - Mac AU & VST3 Universal Plugins
          draft: false
          prerelease: false
          generate_release_notes: true
